
<!DOCTYPE html>
<html>
<head>
<title>Cosmo AI Space Tutor</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚀 Cosmo</h1>
<h2>Your AI Space Tutor 🌌</h2>

<div id="chat">
    <div class="cosmo-message">
        Cosmo 🚀: Hello! I am Cosmo, your AI Space Tutor. 🌌<br>
        Ask me anything about planets, stars, galaxies, and space missions!
    </div>
</div>

<input id="question" placeholder="Ask a space question">

<button onclick="askCosmo()">Ask</button><button onclick="startListening()">🎤 Speak</button>
<button onclick="startQuiz()">🚀 Space Quiz</button>
<h2>🪐 Explore the Solar System</h2>
<button onclick="planetInfo('Mercury')">Mercury</button>
<button onclick="planetInfo('Venus')">Venus</button>
<button onclick="planetInfo('Earth')">Earth</button>
<button onclick="planetInfo('Mars')">Mars</button>
<button onclick="planetInfo('Jupiter')">Jupiter</button>
<button onclick="planetInfo('Saturn')">Saturn</button>
<script src="script.js"></script>
</body>
</html>
